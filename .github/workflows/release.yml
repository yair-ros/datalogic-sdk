name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish to PyPI after building through Trusted Publishing."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          make install PYTHON=python

      - name: Lint
        run: make lint PYTHON=python

      - name: Typecheck
        run: make typecheck PYTHON=python

      - name: Test
        run: make test PYTHON=python

      - name: Build distribution
        run: make clean package PYTHON=python

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    environment: pypi

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1.14
